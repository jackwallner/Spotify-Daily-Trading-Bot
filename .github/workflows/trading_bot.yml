name: Spotify Daily Markets Bot

on:
  # Scheduled runs disabled
  # schedule:
  #   - cron: '7,22,37,52 0-3,13-23 * * *'
  # Allow manual triggering only
  workflow_dispatch:

concurrency:
  group: trading-bot-execution
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit and push the HTML report
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Restore trades.log if exists
        run: |
          if [ -f trades.log ]; then
            echo "trades.log exists from previous run"
          else
            touch trades.log
            echo "Created new trades.log"
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Clear Python cache
        run: |
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          echo "✓ Cleared Python cache"

      - name: Create .env file with secrets
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          cat > .env << 'EOF'
          KALSHI_API_KEY_ID=$KALSHI_API_KEY_ID
          KALSHI_PRIVATE_KEY=$KALSHI_PRIVATE_KEY
          SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID
          SPOTIFY_CLIENT_SECRET=$SPOTIFY_CLIENT_SECRET
          EOF
          echo "✓ Created .env file"

      - name: Run trading script
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python trading_bot.py

      - name: Generate HTML report
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          python generate_report.py || echo "Report generation failed"

      - name: Commit and push report
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/index.html trades.log trades.jsonl || true
          git diff --staged --quiet || git commit -m "Update trade report and log [skip ci]"
          git push origin main || echo "Push failed (may already be up to date)"

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trades-log
          path: |
            trades.log
            trades.jsonl
          if-no-files-found: ignore

